<body>

    <header class="nds-header">
  <div class="container d-flex justify-content-between align-items-center">

    
    <div class="header-left d-flex align-items-center">
    <a href="/NDesignstudyosu/en/">
      <img src="/NDesignstudyosu/images/logo.png" alt="N Design Studio Logo" class="nds-logo">

      </ul>

    </nav>

  </div>
</header>


    <main class="site-main">
      <div class="content-area py-5">
        


<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  
  <div class="card bg-light shadow-lg p-5"
       style="
         max-width: 750px;
         width: 90%;
         text-align: justify;
         border-radius: 14px;
       ">

    
    <div class="text-center mb-4">
      <h1 class="display-4">Contact Us</h1>
      <h5 class="text-muted"></h5>
    </div>

    
    <form id="contact-form"
          action=""
          method="POST"
          novalidate>

      
      <div style="
        display: flex;
        flex-direction: column;
        gap: 22px;
      ">

        
        <div class="form-group">
          <label for="form_name" class="form-label">First Name</label>
          <input id="form_name"
                 type="text"
                 name="name"
                 class="form-control"
                 placeholder="First Name"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_lastname" class="form-label">Last Name</label>
          <input id="form_lastname"
                 type="text"
                 name="surname"
                 class="form-control"
                 placeholder="Last Name"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_email" class="form-label">Email</label>
          <input id="form_email"
                 type="email"
                 name="email"
                 class="form-control"
                 placeholder="Email"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_phone" class="form-label">Phone</label>
          <input id="form_phone"
                 type="tel"
                 name="phone-number"
                 class="form-control"
                 placeholder="Phone"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_message" class="form-label">Inquiry</label>
          <textarea id="form_message"
                    name="inquiry"
                    class="form-control"
                    rows="4"
                    placeholder="Inquiry"
                    required></textarea>
        </div>

        
        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 id="agreeCheck"
                 required />
          <label class="form-check-label" for="agreeCheck">
            I agree to the terms and conditions
          </label>
        </div>

        
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="padding: 14px 0; font-size: 1.2rem;">
          Send Message
        </button>

      </div>
    </form>

  </div>
</section>


      </div>
    </main>

    <script>
      document.addEventListener("scroll", function () {
        const scrollTop = window.scrollY;
        const docHeight = document.body.scrollHeight - window.innerHeight;
        const progress = (scrollTop / docHeight) * 100;
        document.getElementById("reading-progress").style.width = progress + "%";
      });
    </script>
