{{ define "main" }}

<section class="d-flex align-items-center w-100"
         style="min-height: calc(100vh - 80px);">
  <div class="hero-card text-center p-5">
    <h1 class="display-3 fw-bold mb-4">{{ i18n "aboutTitle" }}</h1>
    <h5 class="text-muted mb-4">{{ i18n "aboutSubtitle" }}</h5>

    <p class="english-intro mb-4">{{ i18n "aboutParagraph1" }}</p>
    <p class="mb-4">{{ i18n "aboutParagraph2" }}</p>
    <p class="mb-4">{{ i18n "aboutParagraph3" }}</p>
    <p class="mb-4">{{ i18n "aboutParagraph4" }}</p>

    <div class="text-center mt-4">
      <a href="/NDesignstudyosu/{{ .Lang }}/contact/" class="btn btn-primary me-3">{{ i18n "contactTitle" }}</a>
      <a href="/NDesignstudyosu/{{ .Lang }}/posts/" class="btn btn-outline-primary">{{ i18n "blogButton" }}</a>
    </div>
  </div>
</section>

{{ end }}
