{{ define "main" }}

<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  <div class="card bg-light shadow-lg p-5"
       style="max-width: 850px; width: 90%; border-radius: 14px; text-align: justify;">

    <div class="text-center mb-4">
      <h1 class="display-4">{{ i18n "aboutTitle" }}</h1>
      <h5 class="text-muted">{{ i18n "aboutSubtitle" }}</h5>
    </div>

    <p class="lead mb-4">{{ i18n "aboutParagraph1" }}</p>
    <p class="mb-4">{{ i18n "aboutParagraph2" }}</p>
    <p>{{ i18n "aboutParagraph3" }}</p>

  </div>

</section>

{{ end }}
