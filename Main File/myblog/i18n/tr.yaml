aboutTitle: "Hakkımızda"
aboutSubtitle: "Kim olduğumuz ve ne yaptığımız"

aboutParagraph1: "Açıklık, yaratıcılık ve anlamlı iletişime adanmış çok disiplinli bir stüdyoyuz."
aboutParagraph2: "Çalışmalarımız hukuki farkındalık, çok dilli içerik üretimi ve stratejik hikâye anlatımını kapsar."
aboutParagraph3: "Toplulukları erişilebilir bilgi ve düşünceli tasarım yoluyla güçlendirmeye inanıyoruz."
aboutParagraph4: "Kar amacı gütmeyen kuruluşlar, eğitim kurumları ve işletmelerle işbirliği yaparak, çalışmalarımızla olumlu bir etki yaratmayı hedefliyoruz."