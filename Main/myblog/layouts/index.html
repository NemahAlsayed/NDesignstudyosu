{{ define "main" }}
    <div style="text-align: center; padding: 4rem 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; color: white; margin-bottom: 3rem;">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">{{ .Site.Title }}</h1>
        <p style="font-size: 1.2rem; opacity: 0.9;">Creative Design for Purposeful Impact</p>
    </div>
    
    <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Latest Posts</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem;">
        {{ range first 3 (where .Site.RegularPages "Section" "posts") }}
            <div style="background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <h3 style="margin-bottom: 0.5rem;"><a href="{{ .Permalink }}" style="text-decoration: none; color: #333;">{{ .Title }}</a></h3>
                <p style="color: #666;">{{ .Summary | plainify | truncate 100 }}</p>
                <a href="{{ .Permalink }}" style="color: #667eea; text-decoration: none; margin-top: 1rem; display: inline-block;">Read More →</a>
            </div>
        {{ end }}
    </div>
{{ end }}
