{{ define "main" }}

<!-- Hero wrapper: full width, vertical + horizontal centering -->
<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  <!-- Centered card -->
  <div class="card bg-light shadow-lg p-5"
       style="
         max-width: 750px;
         width: 90%;
         text-align: justify;
         border-radius: 14px;
       ">

    <!-- Title -->
    <div class="text-center mb-4">
      <h1 class="display-4">{{ i18n "contactTitle" }}</h1>
      <h5 class="text-muted">{{ i18n "contactSubtitle" }}</h5>
    </div>

    <!-- Contact Form -->
    <form id="contact-form"
          action="{{ .Site.Params.contacts.form.formspreeLink }}"
          method="POST"
          novalidate>

      <!-- Form stack: evenly spaced vertical layout -->
      <div style="
        display: flex;
        flex-direction: column;
        gap: 22px;
      ">

        <!-- First Name -->
        <div class="form-group">
          <label for="form_name" class="form-label">{{ i18n "firstname" }}</label>
          <input id="form_name"
                 type="text"
                 name="name"
                 class="form-control"
                 placeholder="{{ i18n "firstname" }}"
                 required />
        </div>

        <!-- Last Name -->
        <div class="form-group">
          <label for="form_lastname" class="form-label">{{ i18n "lastname" }}</label>
          <input id="form_lastname"
                 type="text"
                 name="surname"
                 class="form-control"
                 placeholder="{{ i18n "lastname" }}"
                 required />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="form_email" class="form-label">{{ i18n "email" }}</label>
          <input id="form_email"
                 type="email"
                 name="email"
                 class="form-control"
                 placeholder="{{ i18n "email" }}"
                 required />
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="form_phone" class="form-label">{{ i18n "phone" }}</label>
          <input id="form_phone"
                 type="tel"
                 name="phone-number"
                 class="form-control"
                 placeholder="{{ i18n "phone" }}"
                 required />
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="form_message" class="form-label">{{ i18n "inquiry" }}</label>
          <textarea id="form_message"
                    name="inquiry"
                    class="form-control"
                    rows="4"
                    placeholder="{{ i18n "inquiry" }}"
                    required></textarea>
        </div>

        <!-- Checkbox -->
        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 id="agreeCheck"
                 required />
          <label class="form-check-label" for="agreeCheck">
            {{ i18n "checkbox" }}
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="padding: 14px 0; font-size: 1.2rem;">
          {{ i18n "submit" }}
        </button>

      </div>
    </form>

  </div>
</section>

{{ end }}
