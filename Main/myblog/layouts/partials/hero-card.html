<div class="hero-card">
    <div class="hero-content">
        {{ with .Site.Params.homepage.preTitle }}
        <div class="pre-title">{{ . }}</div>
        {{ end }}
        <h1>{{ .Site.Params.homepage.title }}</h1>
        <p class="homepage-intro">{{ .Site.Params.homepage.intro }}</p>
        <div class="hero-buttons">
            <a href="/{{ .Lang }}/posts/" class="btn btn-primary">{{ .Site.Params.homepage.mainButton }}</a>
            <a href="/{{ .Lang }}/about/" class="btn btn-secondary">{{ .Site.Params.homepage.secondButton }}</a>
        </div>
    </div>
</div>
