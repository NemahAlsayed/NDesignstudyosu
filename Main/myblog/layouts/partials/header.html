<header style="background: rgba(5, 4, 6, 0.95); backdrop-filter: blur(12px); position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; border-bottom: 1px solid rgba(209, 0, 0, 0.3);">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; min-height: 72px;">
    
    <!-- LOGO WITH HARDCODED SIZE -->
    <div style="flex-shrink: 0;">
      <a href="/{{ .Lang }}/">
        <img src="/images/logo.png" 
             alt="{{ .Site.Title }}" 
             width="100" 
             height="auto"
             style="width: 100px; height: auto; display: block; max-width: 100px; min-width: 60px;">
      </a>
    </div>

    <!-- NAVIGATION -->
    <nav>
      <ul style="display: flex; gap: 30px; list-style: none; margin: 0; padding: 0;">
        <li><a href="/{{ .Lang }}/about/" style="color: #E8E0D5; text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 500;">{{ i18n "navAbout" }}</a></li>
        <li><a href="/{{ .Lang }}/contact/" style="color: #E8E0D5; text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 500;">{{ i18n "navContact" }}</a></li>
      </ul>
    </nav>

  </div>
</header>
<div style="height: 72px;"></div>

<!-- Mobile responsive override -->
<style>
@media (max-width: 768px) {
  header > div {
    min-height: 60px !important;
  }
  [width="100"] {
    width: 70px !important;
  }
  div[style*="height: 72px"] {
    height: 60px !important;
  }
  nav ul {
    gap: 15px !important;
  }
  nav ul li a {
    font-size: 0.75rem !important;
  }
}
</style>
