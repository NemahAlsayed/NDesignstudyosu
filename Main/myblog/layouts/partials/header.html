<header class="nds-header">
  <div class="container d-flex justify-content-between align-items-center">

    <!-- Left: Logo -->
    <div class="header-left d-flex align-items-center">
    <a href="/{{ .Lang }}/">
      <img src="/images/logo.png" alt="N Design Studio Logo" class="nds-logo" alt="Logo" 
     width="140" 
     height="auto" 
     style="max-width: 140px; width: 100%; height: auto;">
    </a>
    </div>


    <!-- Right: Navigation -->
    <nav class="header-right">
      <ul class="nav nds-nav">
        <li class="nav-item"><a href="/{{ .Lang }}/about/" class="nav-link">{{ i18n "navAbout" }}</a></li>
        <li class="nav-item"><a href="/{{ .Lang }}/contact/" class="nav-link">{{ i18n "navContact" }}</a></li>
      </ul>

    </nav>

  </div>
</header>
