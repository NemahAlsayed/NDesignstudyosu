<header class="nds-header">

    <div class="header-container">

        <!-- Logo -->
        <div class="logo-wrapper">
            <a href="{{ .Site.Home.RelPermalink }}" class="nds-logo-text">
                {{ .Site.Title }}
            </a>
        </div>

        <!-- Desktop Navigation -->
        <nav class="nav-links">
            <a href="/{{ .Lang }}/posts/" class="nav-item">Blog</a>
            <a href="/{{ .Lang }}/about/" class="nav-item">About</a>
            <a href="/{{ .Lang }}/contact/" class="nav-item">Contact</a>

            <!-- Language Dropdown -->
            {{ partial "language-dropdown.html" . }}
        </nav>

        <!-- Mobile Menu Button -->
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobileNav">

        <a href="/{{ .Lang }}/posts/">Blog</a>
        <a href="/{{ .Lang }}/about/">About</a>
        <a href="/{{ .Lang }}/contact/">Contact</a>

        <!-- Language Dropdown (Mobile) -->
        <div class="mobile-lang">
            {{ partial "language-dropdown.html" . }}
        </div>

    </div>

</header>
