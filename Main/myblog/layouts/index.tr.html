{{ define "main" }}

<!-- HERO -->
<section class="nds-hero-video">
    <video autoplay muted loop playsinline class="nds-hero-video-bg">
        <source src="/videos/hero.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay">
        <img src="/images/Slogan.png" alt="Slogan" class="hero-logo">
    </div>

    <div class="nds-hero-tagline">
        Ruhu Olan Dijital Deneyimler Tasarlıyoruz
    </div>

    <div class="nds-hero-video-overlay">
        <div class="nds-scroll-indicator">
            <div class="scroll-circle"></div>
            <div class="scroll-arrow">↓</div>
        </div>
    </div>
</section>

<!-- FEATURED POSTS -->
{{ partial "featured-posts.html" . }}

<!-- SHARED HOME SECTIONS -->
{{ partial "home-sections.html" . }}

{{ end }}
