<article class="nds-post-card">
    <div class="nds-post-image">
        <img src="{{ .Params.featured_image }}" alt="{{ .Title }}">
    </div>

    <div class="nds-post-content">
        <h2 class="nds-post-title">
            <a href="{{ .Permalink }}">{{ .Title }}</a>
        </h2>

        <div class="nds-post-meta">
            {{ .Date.Format "Jan 2, 2006" }} — {{ .Params.category }}
        </div>

        <p class="nds-post-excerpt">
            {{ .Summary }}
        </p>

        <a href="{{ .Permalink }}" class="nds-readmore-btn">Read More</a>
    </div>
</article>
