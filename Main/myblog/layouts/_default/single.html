{{ define "main" }}

<div class="nds-single-wrapper">

    <!-- Featured Image Banner -->
    {{ with .Params.featured_image }}
    <div class="nds-single-banner">
        <img src="{{ . }}" alt="{{ $.Title }}">
        <div class="nds-single-banner-overlay"></div>
    </div>
    {{ end }}

    <!-- Article Container -->
    <article class="nds-single-article">

        <!-- Title Block -->
        <header class="nds-single-header">
            <h1 class="nds-single-title">{{ .Title }}</h1>

            <div class="nds-single-meta">
                <span>{{ .Date.Format "January 2, 2006" }}</span>
                <span class="nds-single-category">{{ .Params.category }}</span>
                <span class="nds-single-reading">{{ .ReadingTime }} min read</span>
            </div>

            <div class="nds-single-divider"></div>
        </header>

        <!-- Share Bar -->
        <div class="nds-share-bar">
            <span class="share-label">Share:</span>

            <a href="https://www.instagram.com/?url={{ .Permalink }}" target="_blank" class="share-icon instagram">
                <i class="bi bi-instagram"></i>
            </a>

            <a href="https://x.com/intent/tweet?url={{ .Permalink }}&text={{ .Title }}" target="_blank" class="share-icon x">
                <i class="bi bi-twitter-x"></i>
            </a>

            <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}" target="_blank" class="share-icon linkedin">
                <i class="bi bi-linkedin"></i>
            </a>
        </div>

        <!-- Content with Drop Cap -->
        <div class="nds-single-content nds-dropcap">
            {{ .Content }}
        </div>

    </article>

</div>

{{ end }}
