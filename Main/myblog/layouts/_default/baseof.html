<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#800000">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Pre-compiled CSS (no SCSS compilation needed) -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/custom.css">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Emergency logo fix - always applies */
        .nds-logo,
        .header-left img,
        .logo-wrapper img {
            width: 110px !important;
            max-width: 110px !important;
            height: auto !important;
        }
        
        @media (max-width: 768px) {
            .nds-logo,
            .header-left img,
            .logo-wrapper img {
                width: 70px !important;
                max-width: 70px !important;
            }
        }
    </style>
    
    {{ block "head" . }}{{ end }}
</head>
<body>
    {{ partial "header.html" . }}
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
</body>
</html>
<style>
/* ULTIMATE LOGO FIX - Works on ALL pages, ALL languages */
.nds-logo,
.header-left img,
.logo-wrapper img,
header img,
img[src*="logo.png"] {
    width: 110px !important;
    max-width: 110px !important;
    height: auto !important;
    min-width: 50px !important;
}

@media (max-width: 768px) {
    .nds-logo,
    .header-left img,
    .logo-wrapper img,
    header img,
    img[src*="logo.png"] {
        width: 85px !important;
        max-width: 85px !important;
    }
}

@media (max-width: 576px) {
    .nds-logo,
    .header-left img,
    .logo-wrapper img,
    header img,
    img[src*="logo.png"] {
        width: 65px !important;
        max-width: 65px !important;
    }
}
</style>
