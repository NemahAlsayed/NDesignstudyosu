<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        main {
            min-height: calc(100vh - 200px);
            padding: 40px 20px;
        }
        footer {
            background: #1a1a2e;
            color: #888;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
    {{ block "head" . }}{{ end }}
</head>
<body>
    {{ partial "header.html" . }}
    <main>
        <div class="container">
            {{ block "main" . }}{{ end }}
        </div>
    </main>
    <footer>
        <p>&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
    </footer>
</body>
</html>
