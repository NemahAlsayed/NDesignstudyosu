{{ define "main" }}
    <h1 style="font-size: 2rem; margin-bottom: 2rem;">{{ .Title }}</h1>
    <div class="posts-grid">
        {{ range .Pages }}
            <div class="post-card">
                <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
                <div class="post-meta">{{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read</div>
                <p>{{ .Summary | plainify | truncate 120 }}</p>
                <a href="{{ .Permalink }}" class="read-more">Read More →</a>
            </div>
        {{ end }}
    </div>
{{ end }}
