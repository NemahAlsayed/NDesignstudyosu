{{ define "main" }}
<h1 style="font-size: 2.5rem; margin-bottom: 40px; text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; background-clip: text; color: transparent;">All Posts</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px;">
    {{ range .Pages }}
    <div style="background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s ease;">
        <div style="padding: 25px;">
            <h2 style="font-size: 1.3rem; margin-bottom: 12px;">
                <a href="{{ .Permalink }}" style="text-decoration: none; color: #333;">{{ .Title }}</a>
            </h2>
            <div style="color: #888; font-size: 0.85rem; margin-bottom: 15px;">
                {{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read
            </div>
            <p style="color: #555; line-height: 1.6; margin-bottom: 20px;">{{ .Summary | plainify | truncate 120 }}</p>
            <a href="{{ .Permalink }}" style="color: #667eea; text-decoration: none; font-weight: 500;">Read More →</a>
        </div>
    </div>
    {{ end }}
</div>
{{ end }}
