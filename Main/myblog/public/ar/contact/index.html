<body>
    <header class="nds-header">
  <div class="header-container">

    
    <div class="logo-wrapper">
      <a href="../../ar/">
        <img src="../../images/logo.png" 
             alt="N Design Studio" 
             class="nds-logo">
      </a>
    </div>

    
    <nav class="header-right">
      <ul class="nav-links">
        <li class="nav-item"><a href="../../ar/about/">حول</a></li>
        <li class="nav-item"><a href="../../ar/contact/">اتصل بنا</a></li>
      </ul>

      
      <div class="lang-switcher">
        <button class="lang-toggle" id="langToggle">
          AR <i>▼</i>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          
            
              <a href="http://localhost:1313/en/contact/" hreflang="en" lang="en">English</a>
            
              <a href="http://localhost:1313/tr/contact/" hreflang="tr" lang="tr">Türkçe</a>
            
          
        </div>
      </div>
    </nav>

    
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>
<div class="header-spacer"></div>


<script>
document.addEventListener('DOMContentLoaded', function() {
  
  const mobileToggle = document.getElementById('mobileMenuToggle');
  const navMenu = document.querySelector('.header-right');
  
  if (mobileToggle && navMenu) {
    mobileToggle.addEventListener('click', function() {
      navMenu.classList.toggle('open');
      document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : '';
    });
  }
  
  
  const langToggle = document.getElementById('langToggle');
  const langDropdown = document.getElementById('langDropdown');
  
  if (langToggle && langDropdown) {
    langToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      langDropdown.classList.toggle('active');
      langToggle.classList.toggle('active');
    });
    
    
    document.addEventListener('click', function() {
      langDropdown.classList.remove('active');
      langToggle.classList.remove('active');
    });
    
    langDropdown.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }
  
  
  const header = document.querySelector('.nds-header');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
});
</script>

    <main>
        


<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  
  <div class="card bg-light shadow-lg p-5"
       style="
         max-width: 750px;
         width: 90%;
         text-align: justify;
         border-radius: 14px;
       ">

    
    <div class="text-center mb-4">
      <h1 class="display-4">اتصل بنا</h1>
      <h5 class="text-muted"></h5>
    </div>

    
    <form id="contact-form"
          action="https://formspree.io/f/mkovywgj"
          method="POST"
          novalidate>

      
      <div style="
        display: flex;
        flex-direction: column;
        gap: 22px;
      ">

        
        <div class="form-group">
          <label for="form_name" class="form-label">الاسم الأول</label>
          <input id="form_name"
                 type="text"
                 name="name"
                 class="form-control"
                 placeholder="الاسم الأول"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_lastname" class="form-label">اسم العائلة</label>
          <input id="form_lastname"
                 type="text"
                 name="surname"
                 class="form-control"
                 placeholder="اسم العائلة"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_email" class="form-label">البريد الإلكتروني</label>
          <input id="form_email"
                 type="email"
                 name="email"
                 class="form-control"
                 placeholder="البريد الإلكتروني"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_phone" class="form-label">رقم الهاتف</label>
          <input id="form_phone"
                 type="tel"
                 name="phone-number"
                 class="form-control"
                 placeholder="رقم الهاتف"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_message" class="form-label">الاستفسار</label>
          <textarea id="form_message"
                    name="inquiry"
                    class="form-control"
                    rows="4"
                    placeholder="الاستفسار"
                    required></textarea>
        </div>

        
        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 id="agreeCheck"
                 required />
          <label class="form-check-label" for="agreeCheck">
            أوافق على الشروط والأحكام
          </label>
        </div>

        
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="padding: 14px 0; font-size: 1.2rem;">
          إرسال
        </button>

      </div>
    </form>

  </div>
</section>
