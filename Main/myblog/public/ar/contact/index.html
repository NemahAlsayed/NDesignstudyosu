<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Design Studio</title>
    
    
    <style>
         
        .nds-logo,
        img[alt="N Design Studio Logo"],
        .header-left img,
        header img {
            width: 100px !important;
            max-width: 100px !important;
            height: auto !important;
            min-width: 50px !important;
        }
        
         
        .nds-header {
            padding: 8px 0 !important;
        }
        
        .header-left {
            flex-shrink: 0 !important;
        }
        
         
        @media (max-width: 768px) {
            .nds-logo,
            img[alt="N Design Studio Logo"],
            .header-left img,
            header img {
                width: 70px !important;
                max-width: 70px !important;
            }
        }
    </style>
    
    
    
    <link rel="stylesheet" href="https://ndesignstudyosu.com.tr/css/styles.ce192ed9729d05355748e1b708cba9bf493561522ed8c3355d308fef7223e616.css">
    
    
</head>
<body>
    <header class="nds-header" style="background: rgba(180, 20, 30, 0.65); backdrop-filter: blur(6px); padding: 0.5rem 0; position: fixed; top: 0; width: 100%; z-index: 999;">
  <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 15px; display: flex; justify-content: space-between; align-items: center;">

    
    <div class="header-left">
      <a href="../../ar/">
        <img src="../../images/logo.png" 
             alt="N Design Studio Logo" 
             style="width: 100px !important; height: auto !important; max-width: 100px !important; display: block;">
      </a>
    </div>

    
    <nav class="header-right">
      <ul style="display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0;">
        <li><a href="../../ar/about/" style="color: #fff; font-weight: 500; text-decoration: none; padding: 0.25rem 0.5rem; transition: 0.3s ease;">حول</a></li>
        <li><a href="../../ar/contact/" style="color: #fff; font-weight: 500; text-decoration: none; padding: 0.25rem 0.5rem; transition: 0.3s ease;">اتصل بنا</a></li>
      </ul>
    </nav>

  </div>
</header>


<div style="height: 80px;"></div>

    <main>
        


<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  
  <div class="card bg-light shadow-lg p-5"
       style="
         max-width: 750px;
         width: 90%;
         text-align: justify;
         border-radius: 14px;
       ">

    
    <div class="text-center mb-4">
      <h1 class="display-4">اتصل بنا</h1>
      <h5 class="text-muted"></h5>
    </div>

    
    <form id="contact-form"
          action=""
          method="POST"
          novalidate>

      
      <div style="
        display: flex;
        flex-direction: column;
        gap: 22px;
      ">

        
        <div class="form-group">
          <label for="form_name" class="form-label">الاسم الأول</label>
          <input id="form_name"
                 type="text"
                 name="name"
                 class="form-control"
                 placeholder="الاسم الأول"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_lastname" class="form-label">اسم العائلة</label>
          <input id="form_lastname"
                 type="text"
                 name="surname"
                 class="form-control"
                 placeholder="اسم العائلة"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_email" class="form-label">البريد الإلكتروني</label>
          <input id="form_email"
                 type="email"
                 name="email"
                 class="form-control"
                 placeholder="البريد الإلكتروني"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_phone" class="form-label">رقم الهاتف</label>
          <input id="form_phone"
                 type="tel"
                 name="phone-number"
                 class="form-control"
                 placeholder="رقم الهاتف"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_message" class="form-label">الاستفسار</label>
          <textarea id="form_message"
                    name="inquiry"
                    class="form-control"
                    rows="4"
                    placeholder="الاستفسار"
                    required></textarea>
        </div>

        
        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 id="agreeCheck"
                 required />
          <label class="form-check-label" for="agreeCheck">
            أوافق على الشروط والأحكام
          </label>
        </div>

        
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="padding: 14px 0; font-size: 1.2rem;">
          إرسال
        </button>

      </div>
    </form>

  </div>
</section>


    </main>
    <footer class="footer bg-dark text-light pt-5 pb-3">

  
  

  
  

  
  

  
  

  
  <div class="text-center mt-4">
    <p class="my-1 fs-6 text-muted">© 2026 N Design Studio. All rights reserved.</p>
  </div>

</footer>

</body>
</html>
