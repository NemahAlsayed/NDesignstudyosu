<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Design Studio</title>
</head>
<body>
    


<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  
  <div class="card bg-light shadow-lg p-5"
       style="
         max-width: 750px;
         width: 90%;
         text-align: justify;
         border-radius: 14px;
       ">

    
    <div class="text-center mb-4">
      <h1 class="display-4">اتصل بنا</h1>
      <h5 class="text-muted"></h5>
    </div>

    
    <form id="contact-form"
          action=""
          method="POST"
          novalidate>

      
      <div style="
        display: flex;
        flex-direction: column;
        gap: 22px;
      ">

        
        <div class="form-group">
          <label for="form_name" class="form-label">الاسم الأول</label>
          <input id="form_name"
                 type="text"
                 name="name"
                 class="form-control"
                 placeholder="الاسم الأول"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_lastname" class="form-label">اسم العائلة</label>
          <input id="form_lastname"
                 type="text"
                 name="surname"
                 class="form-control"
                 placeholder="اسم العائلة"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_email" class="form-label">البريد الإلكتروني</label>
          <input id="form_email"
                 type="email"
                 name="email"
                 class="form-control"
                 placeholder="البريد الإلكتروني"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_phone" class="form-label">رقم الهاتف</label>
          <input id="form_phone"
                 type="tel"
                 name="phone-number"
                 class="form-control"
                 placeholder="رقم الهاتف"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_message" class="form-label">الاستفسار</label>
          <textarea id="form_message"
                    name="inquiry"
                    class="form-control"
                    rows="4"
                    placeholder="الاستفسار"
                    required></textarea>
        </div>

        
        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 id="agreeCheck"
                 required />
          <label class="form-check-label" for="agreeCheck">
            أوافق على الشروط والأحكام
          </label>
        </div>

        
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="padding: 14px 0; font-size: 1.2rem;">
          إرسال
        </button>

      </div>
    </form>

  </div>
</section>


</body>
</html>
