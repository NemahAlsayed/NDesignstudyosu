<script>
document.addEventListener('DOMContentLoaded', function() {
  
  const mobileToggle = document.getElementById('mobileMenuToggle');
  const navMenu = document.querySelector('.header-right');
  
  if (mobileToggle && navMenu) {
    mobileToggle.addEventListener('click', function() {
      navMenu.classList.toggle('open');
      document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : '';
    });
  }
  
  
  const langToggle = document.getElementById('langToggle');
  const langDropdown = document.getElementById('langDropdown');
  
  if (langToggle && langDropdown) {
    langToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      langDropdown.classList.toggle('active');
      langToggle.classList.toggle('active');
    });
    
    
    document.addEventListener('click', function() {
      langDropdown.classList.remove('active');
      langToggle.classList.remove('active');
    });
    
    langDropdown.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  }
  
  
  const header = document.querySelector('.nds-header');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
});
</script>

    <main>
        

<div class="container posts-wrapper">

  
  <div class="posts-search">
    <input type="text" id="searchInput" placeholder="Search posts...">
  </div>

  
  
  

  

  
  
  
  

  
  <div class="category-chips">
    <button class="chip active" data-filter="all">All</button>
    
  </div>

  
  <h1 class="text-center mb-4">Customs</h1>

  
  <div class="row" id="posts-grid">

    

  </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

  const chips = document.querySelectorAll(".chip");
  const cards = document.querySelectorAll(".post-card-wrapper");
  const searchInput = document.getElementById("searchInput");

   
  chips.forEach(chip => {
    chip.addEventListener("click", () => {

      chips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");

      const filter = chip.dataset.filter.toLowerCase();

      cards.forEach(card => {
        const category = card.dataset.category.toLowerCase();

        if (filter === "all" || category === filter) {
          card.style.display = "block";
          card.style.opacity = "1";
        } else {
          card.style.opacity = "0";
          setTimeout(() => card.style.display = "none", 200);
        }
      });
    });
  });

   
  searchInput.addEventListener("input", function () {
    const query = this.value.toLowerCase();

    cards.forEach(card => {
      const title = card.querySelector(".card-title").textContent.toLowerCase();
      const text = card.querySelector(".card-text").textContent.toLowerCase();

      if (title.includes(query) || text.includes(query)) {
        card.style.display = "block";
        card.style.opacity = "1";
      } else {
        card.style.opacity = "0";
        setTimeout(() => card.style.display = "none", 200);
      }
    });
  });

});
</script>
