<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Design Studio</title>
    
    
    <style>
         
        .nds-logo,
        img[alt="N Design Studio Logo"],
        .header-left img,
        header img {
            width: 100px !important;
            max-width: 100px !important;
            height: auto !important;
            min-width: 50px !important;
        }
        
        .nds-header {
            padding: 8px 0 !important;
        }
        
        .header-left {
            flex-shrink: 0 !important;
        }
        
        @media (max-width: 768px) {
            .nds-logo,
            img[alt="N Design Studio Logo"],
            .header-left img,
            header img {
                width: 70px !important;
                max-width: 70px !important;
            }
        }
    </style>
    
    
    
    <link rel="stylesheet" href="https://ndesignstudyosu.com.tr/css/styles.45bbccf8e104d4340117a3c9ba7bbd9edd293b4fe50067ec385da968cd05bf73.css">
    
    
</head>
<body>
    <header class="nds-header">
  <div class="nds-container">

    
    <div class="nds-logo">
      <a href="https://ndesignstudyosu.com.tr/en/">
        <img src="https://ndesignstudyosu.com.tr/images/logo.png" alt="N Design Studio Logo">
      </a>
    </div>

    
    <nav class="nds-nav">
      <ul>
        <li><a href="https://ndesignstudyosu.com.tr/en/about/">About</a></li>
        <li><a href="https://ndesignstudyosu.com.tr/en/contact/">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>


<div class="nds-header-spacer"></div>

    <main>
        


<section style="
  width: 100%;
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
">

  
  <div class="card bg-light shadow-lg p-5"
       style="
         max-width: 750px;
         width: 90%;
         text-align: justify;
         border-radius: 14px;
       ">

    
    <div class="text-center mb-4">
      <h1 class="display-4">Contact Us</h1>
      <h5 class="text-muted"></h5>
    </div>

    
    <form id="contact-form"
          action=""
          method="POST"
          novalidate>

      
      <div style="
        display: flex;
        flex-direction: column;
        gap: 22px;
      ">

        
        <div class="form-group">
          <label for="form_name" class="form-label">First Name</label>
          <input id="form_name"
                 type="text"
                 name="name"
                 class="form-control"
                 placeholder="First Name"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_lastname" class="form-label">Last Name</label>
          <input id="form_lastname"
                 type="text"
                 name="surname"
                 class="form-control"
                 placeholder="Last Name"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_email" class="form-label">Email</label>
          <input id="form_email"
                 type="email"
                 name="email"
                 class="form-control"
                 placeholder="Email"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_phone" class="form-label">Phone</label>
          <input id="form_phone"
                 type="tel"
                 name="phone-number"
                 class="form-control"
                 placeholder="Phone"
                 required />
        </div>

        
        <div class="form-group">
          <label for="form_message" class="form-label">Inquiry</label>
          <textarea id="form_message"
                    name="inquiry"
                    class="form-control"
                    rows="4"
                    placeholder="Inquiry"
                    required></textarea>
        </div>

        
        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 id="agreeCheck"
                 required />
          <label class="form-check-label" for="agreeCheck">
            I agree to the terms and conditions
          </label>
        </div>

        
        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                style="padding: 14px 0; font-size: 1.2rem;">
          Send Message
        </button>

      </div>
    </form>

  </div>
</section>


    </main>
    <footer class="nds-footer">

  
  

  
  

  
  

  
  

  
  <div class="nds-footer-copy">
    <p>© 2026 N Design Studio. All rights reserved.</p>
  </div>

</footer>

</body>
</html>
