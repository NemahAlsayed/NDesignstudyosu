<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Design Studio</title>
    
    
    <link rel="stylesheet" href="https://ndesignstudyosu.com.tr/css/custom.css">
    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         
        .nds-logo,
        img[alt="N Design Studio Logo"],
        .header-left img,
        header img {
            width: 100px !important;
            max-width: 100px !important;
            height: auto !important;
        }
        
        .nds-header {
            background: rgba(180, 20, 30, 0.65) !important;
            backdrop-filter: blur(6px) !important;
            padding: 8px 0 !important;
            position: fixed !important;
            top: 0 !important;
            width: 100% !important;
            z-index: 999 !important;
        }
        
        body {
            padding-top: 80px !important;
            background: #0A0808;
            color: #E8E0D5;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .hero-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #d10000;
            color: white;
            border: none;
        }
        
        .btn-primary:hover {
            background: #800000;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            color: #d10000;
            border: 2px solid #d10000;
        }
        
        .btn-secondary:hover {
            background: #d10000;
            color: white;
        }
        
         
        .language-tabs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
        }
        
        .lang-tab {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .lang-tab:hover,
        .lang-tab.active {
            background: #d10000;
            color: white;
        }
        
         
        @media (max-width: 768px) {
            .nds-logo,
            header img {
                width: 70px !important;
            }
            
            .hero-card {
                padding: 1rem;
            }
            
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
    
    
</head>
<body>
    <header class="nds-header">
  <div class="container" style="display: flex; justify-content: space-between; align-items: center;">

    
    <div class="header-left">
      <a href="https://ndesignstudyosu.com.tr/en/">
        <img src="https://ndesignstudyosu.com.tr/images/logo.png" 
             alt="N Design Studio Logo" 
             class="nds-logo"
             style="width: 100px; height: auto; display: block;">
      </a>
    </div>

    
    <nav class="header-right">
      <ul style="display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0;">
        <li><a href="https://ndesignstudyosu.com.tr/en/about/" style="color: #fff; text-decoration: none; font-weight: 500;">About</a></li>
        <li><a href="https://ndesignstudyosu.com.tr/en/contact/" style="color: #fff; text-decoration: none; font-weight: 500;">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>
<div style="height: 80px;"></div>

    <main>
        

<h1 class="text-center mb-4">Abstract-Flower-Wall-Art</h1>
<hr />

<div class="row justify-content-center mt-4">
  <div class="col-12 text-center">

    
      <a href="https://ndesignstudyosu.com.tr/en/posts/2025/12/2025-12-20--metal-art-sheet-flower-abstract-landscape-painting-a-modern-statement-piece/" class="btn btn-sm btn-light border-primary m-2">
        #🌸 Metal Art Sheet Flower Abstract Landscape Painting – A Modern Statement Piece
      </a>
    

  </div>
</div>


    </main>
    <footer class="nds-footer">

  
  

  
  

  
  

  
  

  
  <div class="nds-footer-copy">
    <p>© 2026 N Design Studio. All rights reserved.</p>
  </div>

</footer>

</body>
</html>
