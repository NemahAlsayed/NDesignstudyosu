baseURL = "https://ndesignstudyosu.com.tr/"
title = "N Design Studio"
defaultContentLanguage = "ar"
defaultContentLanguageInSubdir = true

############################################
# LANGUAGES
############################################

[languages]

############################################
# ARABIC (DEFAULT)
############################################
[languages.ar]
languageName = "العربية"
weight = 1
contentDir = "content/ar"
title = "N Design Studio"
languageCode = "ar"
direction = "rtl"

[languages.ar.menu]
  [[languages.ar.menu.main]]
  name = "من نحن"
  url = "/ar/about/"
  weight = 1

  [[languages.ar.menu.main]]
  name = "المدونة"
  url = "/ar/posts/"
  weight = 2

  [[languages.ar.menu.main]]
  name = "الأعمال"
  url = "/ar/portfolio/"
  weight = 3

############################################
# ENGLISH
############################################
[languages.en]
languageName = "English"
weight = 2
contentDir = "content/en"
title = "N Design Studio"
languageCode = "en"

[languages.en.menu]
  [[languages.en.menu.main]]
  name = "About"
  url = "/en/about/"
  weight = 1

  [[languages.en.menu.main]]
  name = "Blog"
  url = "/en/posts/"
  weight = 2

  [[languages.en.menu.main]]
  name = "Portfolio"
  url = "/en/portfolio/"
  weight = 3

############################################
# TURKISH
############################################
[languages.tr]
languageName = "Türkçe"
weight = 3
contentDir = "content/tr"
title = "N Design Studio"
languageCode = "tr"

[languages.tr.menu]
  [[languages.tr.menu.main]]
  name = "Hakkında"
  url = "/tr/about/"
  weight = 1

  [[languages.tr.menu.main]]
  name = "Blog"
  url = "/tr/posts/"
  weight = 2

  [[languages.tr.menu.main]]
  name = "Portföy"
  url = "/tr/portfolio/"
  weight = 3

