<section class="home-hero-section">
  <div class="container">
    <div class="hero-card">

      <!-- Title -->
      <h1 class="hero-title">
        {{ .Site.Params.homepage.title }}
      </h1>

      <!-- Intro -->
      <p class="hero-intro">
        {{ .Site.Params.homepage.intro | markdownify }}
      </p>

      <!-- Language Tabs -->
      <div class="language-tabs">
        <a href="/ar/" class="lang-tab{{ if eq .Lang "ar" }} active{{ end }}">العربية</a>
        <a href="/en/" class="lang-tab{{ if eq .Lang "en" }} active{{ end }}">English</a>
        <a href="/tr/" class="lang-tab{{ if eq .Lang "tr" }} active{{ end }}">Türkçe</a>
      </div>

    </div>
  </div>
</section>
