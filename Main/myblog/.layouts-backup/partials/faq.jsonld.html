{{ if .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $index, $item := .Params.faq -}}
    {
      "@type": "Question",
      "name": "{{ $item.question }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ $item.answer }}"
      }
    }{{ if lt (add $index 1) (len $.Params.faq) }},{{ end }}
    {{- end -}}
  ]
}
</script>
{{ end }}
