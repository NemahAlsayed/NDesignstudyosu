<header class="nds-header">

    <div class="header-container">

     <!-- Logo -->
<div class="nds-logo">
  <a href="{{ .Site.Home.RelPermalink }}">
    <img src="/images/logo.png" alt="N Design Studio Logo">
  </a>
</div>



        <!-- Desktop Navigation -->
        <nav class="nav-links">

            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" class="nav-item">
                {{ .Name }}
            </a>
            {{ end }}

            <!-- Language Dropdown -->
            {{ partial "language-dropdown.html" . }}
        </nav>

        <!-- Mobile Menu Button -->
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobileNav">

        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}

        <div class="mobile-lang">
            {{ partial "language-dropdown.html" . }}
        </div>

    </div>

</header>
