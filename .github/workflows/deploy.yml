name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # -----------------------------
      # Clean old Hugo cache (important)
      # -----------------------------
      - name: Clean old Hugo cache
        run: |
          echo "Cleaning old Hugo cache..."
          rm -rf Main/myblog/resources/_gen || true

      # -----------------------------
      # Cache Hugo resources
      # -----------------------------
      - name: Cache Hugo resources
        uses: actions/cache@v3
        with:
          path: Main/myblog/resources/_gen
          key: ${{ runner.os }}-hugo-${{ hashFiles('Main/myblog/**') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      # -----------------------------
      # Cache Dart Sass
      # -----------------------------
      - name: Cache Dart Sass
        uses: actions/cache@v3
        with:
          path: ~/.dart-sass
          key: ${{ runner.os }}-dart-sass
          restore-keys: |
            ${{ runner.os }}-dart-sass

      # -----------------------------
      # Install Dart Sass
      # -----------------------------
      - name: Install Dart Sass
        run: |
          sudo snap install dart-sass
          mkdir -p ~/.dart-sass

      # -----------------------------
      # Setup Hugo Extended
      # -----------------------------
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      # -----------------------------
      # Debug SCSS files
      # -----------------------------
      - name: Debug SCSS files
        working-directory: "Main/myblog"
        run: |
          echo "=== SCSS FILES FOUND ==="
          find assets -name "*.scss" -print || echo "No SCSS files found!"
          echo "========================="

      # -----------------------------
      # Build Hugo site (correct baseURL)
      # -----------------------------
      - name: Build Hugo site
        working-directory: "Main/myblog"
        run: |
          echo "=== Starting Hugo Build ==="
          hugo --cleanDestinationDir --minify --gc --enableGitInfo \
          --baseURL "https://ndesignstudyosu.com.tr/" \
          --logLevel info
          echo "=== Hugo Build Completed ==="
        env:
          HUGO_ENV: production

      # -----------------------------
      # Add CNAME
      # -----------------------------
      - name: Add CNAME file
        run: echo "ndesignstudyosu.com.tr" > "Main/myblog/public/CNAME"

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Main/myblog/public"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
