name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true  # IMPORTANT: Needed for SCSS processing

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Verify custom files
        working-directory: "Main/myblog"
        run: |
          echo "=== Checking partials ==="
          ls -la layouts/partials/ 2>/dev/null || echo "No partials found"
          echo "=== Checking SCSS ==="
          find assets -name "*.scss" 2>/dev/null || echo "No SCSS found"
          echo "=== Checking static ==="
          ls -la static/ 2>/dev/null || echo "No static files"

      - name: Build Hugo site
        working-directory: "Main/myblog"
        run: |
          echo "=== Building with SCSS support ==="
          hugo -D --cleanDestinationDir --gc --enableGitInfo \
          --baseURL "https://ndesignstudyosu.com.tr/" \
          --logLevel info
          echo "=== Build complete ==="

      - name: Verify build output
        working-directory: "Main/myblog"
        run: |
          echo "=== Built files ==="
          ls -la public/
          echo "=== Looking for CSS ==="
          find public -name "*.css" | head -5
          echo "=== Looking for images ==="
          find public -name "*.png" | head -5

      - name: Add CNAME file
        run: echo "ndesignstudyosu.com.tr" > "Main/myblog/public/CNAME"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Main/myblog/public"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
